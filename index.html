<!DOCTYPE html>
<html lang="ms">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M Gas Steel — Sistem Keputusan Staf</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f766e" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select:none; user-select:none; }
      @media print { body { display:none !important; } }
      /* iOS Safari auto-zooms the whole page on focus for any input/select/
         textarea rendered under 16px, and often fails to zoom back out
         cleanly afterwards — exactly the "screen enlarges and doesn't fit
         back" report (Wylee 2026-09-06). Many fields in App.jsx use 12-15px
         inline styles for layout density; this overrides just the effective
         font size (not padding/layout) so typing never triggers the zoom.
         !important is required: it's the only thing that outranks an inline
         style="font-size:...". Scoped to the app's own mobile breakpoint
         (matches the @media (max-width: 880px) already used for the sidebar
         in App.jsx) so desktop keeps its intentional 12-14px field sizes and
         the login PIN field keeps its 20px letter-spaced styling. */
      @media (max-width: 880px) {
        input, select, textarea { font-size: 16px !important; }
      }
    </style>
  </head>
  <body style="background:#0f2744;margin:0;"><div id="splash" style="position:fixed;inset:0;background:#0f2744;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.3s"><div style="color:white;font-family:sans-serif;font-size:18px;letter-spacing:2px">M GAS STEEL</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>window.addEventListener("load",function(){setTimeout(function(){var s=document.getElementById("splash");if(s){s.style.opacity="0";setTimeout(function(){s.remove()},300)}},300)})</script></body>
</html>
